name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 22 is what Cloud Run runs; 24 is the next LTS, so a break shows up before an upgrade.
        node: [22, 24]
    env:
      # The default job never reaches a model: live evals are opt-in and need credentials.
      RUN_LLM_EVALS: ""
      ANTHROPIC_API_KEY: ""
      VERTEX_PROJECT_ID: ""
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm eval
