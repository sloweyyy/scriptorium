name: mutation
# Guardrail mutation testing: each mutant sabotages one safety control; its eval must go red.
# A survivor means a control could break silently with CI still green. Weekly, and whenever
# a guardrail's code or its eval changes.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 1"
  pull_request:
    # Every file a mutant guards, and the evals that guard them. A pull request runs only
    # the mutants it can break (see MUTATE_CHANGED in scripts/mutate.ts).
    paths:
      - "packages/**"
      - "apps/agents/src/**"
      - "evals/**"
      - "scripts/mutate.ts"
      - "scripts/audit.ts"
      - "Dockerfile"
      - ".dockerignore"
permissions:
  contents: read
jobs:
  mutate:
    runs-on: ubuntu-latest
    # The whole set, weekly, takes most of an hour.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Mutants for what the pull request changed (all of them on the schedule)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            MUTATE_CHANGED="$(git diff --name-only "origin/$BASE_REF...HEAD")"
            export MUTATE_CHANGED
          fi
          pnpm mutate
