<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 580" width="1130" height="580" role="img" aria-label="Every trigger passes a gate into one agent turn; every tool call goes through the policy. Reads fetch records that the answer must cite; writes wait on an approval card for a named person, then run exactly once. Everything lands in a hash-chained audit log.">
      <style>
  .dg-box{fill:#fbfaf7;stroke:#e6e3dc;stroke-width:1.5}
  .dg-hot{fill:#eceffb;stroke:#2d3a8c;stroke-width:2}
  .dg-title{font:600 14px Inter,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#1b1d22}
  .dg-sub{font:400 11.5px Inter,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#5d6270}
  .dg-kicker{font:600 11px Inter,system-ui,sans-serif;letter-spacing:.08em;fill:#8c909b}
  .dg-label{font:500 11.5px Inter,system-ui,sans-serif;fill:#5d6270}
  .dg-hottext{fill:#2d3a8c;font-weight:600}
  .dg-line{fill:none;stroke:#5d6270;stroke-width:1.5}
  .dg-hotline{stroke:#2d3a8c;stroke-width:2;stroke-dasharray:6 4}
  .dg-head{fill:#5d6270}.dg-head-hot{fill:#2d3a8c}
  .dg-tap{stroke:#8c909b;stroke-width:1;stroke-dasharray:2 4}
  .bg{fill:#ffffff}
  @media (prefers-color-scheme: dark){
    .bg{fill:#181b22}
    .dg-box{fill:#111318;stroke:#2a2e38}.dg-hot{fill:#1e2440;stroke:#9aa8ff}
    .dg-title{fill:#eceef2}.dg-sub,.dg-label{fill:#a6abb8}.dg-kicker{fill:#767b88}
    .dg-hottext{fill:#9aa8ff}.dg-line{stroke:#a6abb8}.dg-hotline{stroke:#9aa8ff}
    .dg-head{fill:#a6abb8}.dg-head-hot{fill:#9aa8ff}.dg-tap{stroke:#767b88}
  }
</style>
      <rect class="bg" width="1130" height="580" rx="14"/>
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-head"/></marker>
        <marker id="arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-head-hot"/></marker>
      </defs>
            <rect class="dg-box" x="20" y="96" width="150" height="52" rx="10"/>
      <text class="dg-title" x="95.0" y="118" text-anchor="middle">Slack</text>
      <text class="dg-sub" x="95.0" y="136" text-anchor="middle">mention · DM · command</text>
      <rect class="dg-box" x="20" y="160" width="150" height="52" rx="10"/>
      <text class="dg-title" x="95.0" y="182" text-anchor="middle">Jira</text>
      <text class="dg-sub" x="95.0" y="200" text-anchor="middle">comments · new issues</text>
      <rect class="dg-box" x="20" y="224" width="150" height="52" rx="10"/>
      <text class="dg-title" x="95.0" y="246" text-anchor="middle">GitHub</text>
      <text class="dg-sub" x="95.0" y="264" text-anchor="middle">pull request opened</text>
      <rect class="dg-box" x="20" y="288" width="150" height="52" rx="10"/>
      <text class="dg-title" x="95.0" y="310" text-anchor="middle">Timers</text>
      <text class="dg-sub" x="95.0" y="328" text-anchor="middle">digest · reminders</text>
      <text class="dg-kicker" x="95" y="80" text-anchor="middle">TRIGGERS</text>
      <rect class="dg-box" x="220" y="170" width="128" height="100" rx="10"/>
      <text class="dg-title" x="284" y="208" text-anchor="middle">Gate + lanes</text>
      <text class="dg-sub" x="284" y="226" text-anchor="middle">drops with a reason</text>
      <text class="dg-sub" x="284" y="241" text-anchor="middle">one lane per thread</text>
      <rect class="dg-box" x="396" y="170" width="132" height="100" rx="10"/>
      <text class="dg-title" x="462" y="208" text-anchor="middle">Agent turn</text>
      <text class="dg-sub" x="462" y="226" text-anchor="middle">model + skills</text>
      <text class="dg-sub" x="462" y="241" text-anchor="middle">held to the thread</text>
      <rect class="dg-box" x="580" y="170" width="140" height="100" rx="10"/>
      <text class="dg-title" x="650.0" y="208" text-anchor="middle">Policy</text>
      <text class="dg-sub" x="650.0" y="226" text-anchor="middle">allow · approve · deny</text>
      <text class="dg-sub" x="650.0" y="241" text-anchor="middle">per tool</text>
      <rect class="dg-box" x="580" y="40" width="140" height="64" rx="10"/>
      <text class="dg-title" x="650" y="64" text-anchor="middle">Admin controls</text>
      <text class="dg-sub" x="650" y="82" text-anchor="middle">pause · read-only</text>
      <text class="dg-sub" x="650" y="96" text-anchor="middle">switch a tool off</text>
      <rect class="dg-box" x="780" y="40" width="150" height="64" rx="10"/>
      <text class="dg-title" x="855.0" y="60" text-anchor="middle">Connectors</text>
      <text class="dg-sub" x="855.0" y="78" text-anchor="middle">Jira · Confluence · Slack</text>
      <text class="dg-sub" x="855.0" y="93" text-anchor="middle">GitHub · docs vault</text>
      <rect class="dg-box" x="960" y="40" width="150" height="64" rx="10"/>
      <text class="dg-title" x="1035.0" y="68" text-anchor="middle">Grounding</text>
      <text class="dg-sub" x="1035.0" y="86" text-anchor="middle">claim ⇔ fetched record</text>
      <rect class="dg-box" x="960" y="178" width="150" height="84" rx="10"/>
      <text class="dg-title" x="1035.0" y="208" text-anchor="middle">Cited reply</text>
      <text class="dg-sub" x="1035.0" y="226" text-anchor="middle">or “not in the docs”</text>
      <text class="dg-sub" x="1035.0" y="241" text-anchor="middle">→ gap ticket</text>
      <rect class="dg-box" x="780" y="330" width="150" height="64" rx="10"/>
      <text class="dg-title" x="855.0" y="350" text-anchor="middle">Approval card</text>
      <text class="dg-sub" x="855.0" y="368" text-anchor="middle">exact arguments</text>
      <text class="dg-sub" x="855.0" y="383" text-anchor="middle">hash-bound</text>
      <rect class="dg-box dg-hot" x="960" y="330" width="150" height="64" rx="10"/>
      <text class="dg-title" x="1035.0" y="350" text-anchor="middle">Named approver</text>
      <text class="dg-sub" x="1035.0" y="368" text-anchor="middle">signed · single-use</text>
      <text class="dg-sub" x="1035.0" y="383" text-anchor="middle">never the requester</text>
      <rect class="dg-box" x="960" y="430" width="150" height="64" rx="10"/>
      <text class="dg-title" x="1035.0" y="450" text-anchor="middle">Write, once</text>
      <text class="dg-sub" x="1035.0" y="468" text-anchor="middle">op-keyed · probed</text>
      <text class="dg-sub" x="1035.0" y="483" text-anchor="middle">retry-safe</text>
      <rect class="dg-box" x="220" y="522" width="890" height="40" rx="10"/>
      <text class="dg-title" x="665" y="547" text-anchor="middle">Audit log — hash-chained: every decision, approval, write and run</text>
      <polyline class="dg-line" points="170,122 218,196" marker-end="url(#arrow)"/>
      <polyline class="dg-line" points="170,186 218,212" marker-end="url(#arrow)"/>
      <polyline class="dg-line" points="170,250 218,228" marker-end="url(#arrow)"/>
      <polyline class="dg-line" points="170,314 218,244" marker-end="url(#arrow)"/>
      <polyline class="dg-line" points="348,220 394,220" marker-end="url(#arrow)"/>
      <text class="dg-label" x="371" y="211" text-anchor="middle">event</text>
      <polyline class="dg-line" points="528,220 578,220" marker-end="url(#arrow)"/>
      <text class="dg-label" x="553" y="211" text-anchor="middle">calls</text>
      <polyline class="dg-line" points="650,104 650,168" marker-end="url(#arrow)"/>
      <text class="dg-label" x="660" y="140" text-anchor="start">narrows</text>
      <polyline class="dg-line" points="720,200 750,200 750,72 778,72" marker-end="url(#arrow)"/>
      <text class="dg-label" x="756" y="140" text-anchor="start">allow: read</text>
      <polyline class="dg-line" points="930,72 958,72" marker-end="url(#arrow)"/>
      <polyline class="dg-line" points="1035,104 1035,176" marker-end="url(#arrow)"/>
      <text class="dg-label" x="1043" y="146" text-anchor="start">cited</text>
      <polyline class="dg-line dg-hotline" points="720,240 750,240 750,362 778,362" marker-end="url(#arrow-hot)"/>
      <text class="dg-label dg-hottext" x="756" y="300" text-anchor="start">approve: write</text>
      <polyline class="dg-line dg-hotline" points="930,362 958,362" marker-end="url(#arrow-hot)"/>
      <polyline class="dg-line dg-hotline" points="1035,394 1035,428" marker-end="url(#arrow-hot)"/>
      <text class="dg-label dg-hottext" x="1043" y="416" text-anchor="start">approved</text>
      <text class="dg-label" x="650" y="292" text-anchor="middle">deny: never offered</text>
      <line class="dg-tap" x1="284" y1="270" x2="284" y2="520"/>
      <line class="dg-tap" x1="650" y1="300" x2="650" y2="520"/>
      <line class="dg-tap" x1="1035" y1="494" x2="1035" y2="520"/>
      </svg>
