<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="700" fill="#ffffff"/>
  <rect x="0" y="0" width="900" height="56" fill="#111725"/>
  <text x="24" y="35" fill="#ffffff" font-size="18" font-weight="bold">Beacon — Admin console</text>
  <text x="740" y="35" fill="#9aa4b2" font-size="14">admin@acme.io</text>

  <text x="40" y="98" fill="#111725" font-size="22" font-weight="bold">Notifications › Digest emails</text>

  <text x="40" y="140" fill="#334155" font-size="14" font-weight="bold">Frequency *</text>
  <rect x="40" y="150" width="220" height="40" fill="#ffffff" stroke="#94a3b8" rx="6"/>
  <text x="52" y="175" fill="#111725" font-size="14">Weekly ▾</text>
  <text x="272" y="175" fill="#94a3b8" font-size="12">Daily · Weekly</text>

  <text x="40" y="226" fill="#334155" font-size="14" font-weight="bold">Send day</text>
  <rect x="40" y="236" width="220" height="40" fill="#ffffff" stroke="#94a3b8" rx="6"/>
  <text x="52" y="261" fill="#111725" font-size="14">Monday ▾</text>
  <text x="40" y="292" fill="#94a3b8" font-size="12">only shown for Weekly</text>

  <text x="290" y="226" fill="#334155" font-size="14" font-weight="bold">Send time *</text>
  <rect x="290" y="236" width="140" height="40" fill="#ffffff" stroke="#94a3b8" rx="6"/>
  <text x="302" y="261" fill="#111725" font-size="14">09:00</text>

  <text x="450" y="226" fill="#334155" font-size="14" font-weight="bold">Timezone</text>
  <rect x="450" y="236" width="220" height="40" fill="#ffffff" stroke="#94a3b8" rx="6"/>
  <text x="462" y="261" fill="#111725" font-size="14">Asia/Ho_Chi_Minh ▾</text>
  <text x="450" y="292" fill="#94a3b8" font-size="12">defaults to workspace timezone</text>

  <text x="40" y="330" fill="#334155" font-size="14" font-weight="bold">Include sections</text>
  <rect x="40" y="342" width="18" height="18" fill="#1B45C9" rx="4"/>
  <text x="66" y="356" fill="#111725" font-size="14">Incidents</text>
  <rect x="40" y="370" width="18" height="18" fill="#1B45C9" rx="4"/>
  <text x="66" y="384" fill="#111725" font-size="14">Maintenance</text>
  <rect x="40" y="398" width="18" height="18" fill="#ffffff" stroke="#94a3b8" rx="4"/>
  <text x="66" y="412" fill="#111725" font-size="14">Usage summary</text>

  <text x="40" y="466" fill="#334155" font-size="14" font-weight="bold">Recipients</text>
  <text x="40" y="490" fill="#111725" font-size="14">All workspace admins</text>
  <text x="212" y="490" fill="#94a3b8" font-size="12">fixed — not configurable in v1</text>

  <rect x="700" y="620" width="160" height="46" fill="#1B45C9" rx="8"/>
  <text x="742" y="649" fill="#ffffff" font-size="16" font-weight="bold">Save</text>
  <rect x="596" y="620" width="88" height="46" fill="#ffffff" stroke="#94a3b8" rx="8"/>
  <text x="620" y="649" fill="#334155" font-size="16">Cancel</text>
</svg>
