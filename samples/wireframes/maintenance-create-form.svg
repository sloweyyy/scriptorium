<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="720" fill="#ffffff"/>
  <rect x="0" y="0" width="900" height="56" fill="#111725"/>
  <text x="24" y="35" fill="#ffffff" font-size="18" font-weight="bold">Beacon — Admin console</text>
  <text x="740" y="35" fill="#9aa4b2" font-size="14">admin@acme.io</text>

  <text x="40" y="98" fill="#111725" font-size="22" font-weight="bold">Announcements › New maintenance</text>

  <text x="40" y="140" fill="#334155" font-size="14" font-weight="bold">Title *</text>
  <rect x="40" y="150" width="560" height="40" fill="#ffffff" stroke="#94a3b8" rx="6"/>
  <text x="52" y="175" fill="#94a3b8" font-size="14">Database maintenance — EU region</text>
  <text x="612" y="175" fill="#94a3b8" font-size="12">max 120 chars</text>

  <text x="40" y="226" fill="#334155" font-size="14" font-weight="bold">Start *</text>
  <rect x="40" y="236" width="220" height="40" fill="#ffffff" stroke="#94a3b8" rx="6"/>
  <text x="52" y="261" fill="#111725" font-size="14">2026-08-20  01:00</text>

  <text x="290" y="226" fill="#334155" font-size="14" font-weight="bold">End *</text>
  <rect x="290" y="236" width="220" height="40" fill="#ffffff" stroke="#94a3b8" rx="6"/>
  <text x="302" y="261" fill="#111725" font-size="14">2026-08-20  03:00</text>

  <text x="540" y="226" fill="#334155" font-size="14" font-weight="bold">Timezone</text>
  <rect x="540" y="236" width="220" height="40" fill="#ffffff" stroke="#94a3b8" rx="6"/>
  <text x="552" y="261" fill="#111725" font-size="14">Asia/Ho_Chi_Minh ▾</text>
  <text x="540" y="292" fill="#94a3b8" font-size="12">defaults to workspace timezone</text>

  <text x="40" y="330" fill="#334155" font-size="14" font-weight="bold">Affected components *</text>
  <rect x="40" y="342" width="18" height="18" fill="#1B45C9" rx="4"/>
  <text x="66" y="356" fill="#111725" font-size="14">API</text>
  <rect x="40" y="370" width="18" height="18" fill="#1B45C9" rx="4"/>
  <text x="66" y="384" fill="#111725" font-size="14">Database (EU)</text>
  <rect x="40" y="398" width="18" height="18" fill="#ffffff" stroke="#94a3b8" rx="4"/>
  <text x="66" y="412" fill="#111725" font-size="14">Dashboard</text>
  <rect x="40" y="426" width="18" height="18" fill="#ffffff" stroke="#94a3b8" rx="4"/>
  <text x="66" y="440" fill="#111725" font-size="14">Notifications</text>

  <text x="40" y="490" fill="#334155" font-size="14" font-weight="bold">Description (optional)</text>
  <rect x="40" y="500" width="720" height="80" fill="#ffffff" stroke="#94a3b8" rx="6"/>
  <text x="52" y="525" fill="#94a3b8" font-size="14">We are upgrading the EU database cluster…</text>

  <rect x="40" y="608" width="44" height="24" fill="#1B45C9" rx="12"/>
  <circle cx="72" cy="620" r="9" fill="#ffffff"/>
  <text x="96" y="625" fill="#111725" font-size="14" font-weight="bold">Notify subscribers</text>
  <text x="96" y="644" fill="#94a3b8" font-size="12">email on publish + reminder 1 hour before start</text>

  <rect x="560" y="600" width="200" height="46" fill="#1B45C9" rx="8"/>
  <text x="622" y="629" fill="#ffffff" font-size="16" font-weight="bold">Publish</text>
  <rect x="440" y="600" width="104" height="46" fill="#ffffff" stroke="#94a3b8" rx="8"/>
  <text x="466" y="629" fill="#334155" font-size="16">Cancel</text>
</svg>
