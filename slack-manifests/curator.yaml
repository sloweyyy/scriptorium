# Create at https://api.slack.com/apps -> "Create New App" -> "From a manifest"
display_information:
  name: Curator
  description: Organizes the knowledge vault and answers questions from it, with sources.
  background_color: "#0B6248"
features:
  bot_user:
    display_name: Curator
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - channels:history
      - groups:history
      - im:history
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
