# Create at https://api.slack.com/apps -> "Create New App" -> "From a manifest"
display_information:
  name: Scribe
  description: Drafts user documentation from PRDs and designs — humans approve everything.
  background_color: "#1B45C9"
features:
  bot_user:
    display_name: Scribe
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - files:read
      - channels:history
      - groups:history
      - im:history
      - reactions:read
      - reactions:write
      # The approver's name ends up in a git commit message, so resolve it to a human name.
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - reaction_added
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
